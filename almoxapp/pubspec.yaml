name: almoxapp
description: Almoxarifado de construtora - requisicoes de materiais para obras.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  toast: ^0.3.0
  share_plus: ^10.1.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - recursos/jsons/materiais.json
    - recursos/jsons/obras.json
    - recursos/jsons/requisicoes.json
    - recursos/jsons/comentarios.json
    - recursos/imagens/logo.png
